name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run typecheck

      - run: npm test

      - name: Committed dist matches the source
        run: |
          npm run build
          git diff --exit-code --stat -- dist

  release:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Move the major tag
        run: |
          latest="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' HEAD 2>/dev/null)" || { echo "No vX.Y.Z tag on HEAD; nothing to move"; exit 0; }
          major="${latest%%.*}"
          sha="$(git rev-parse "$latest^{commit}")"

          if ! ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$major" --jq '.object.type + " " + .object.sha' 2>"$RUNNER_TEMP/ref.err")"; then
            grep -q 'HTTP 404' "$RUNNER_TEMP/ref.err" || { cat "$RUNNER_TEMP/ref.err" >&2; exit 1; }
            ref=""
          fi
          if [ -z "$ref" ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$major" -f sha="$sha" --silent
            echo "Created $major at $sha ($latest)"
            exit 0
          fi

          current="${ref#* }"
          if [ "${ref%% *}" = tag ]; then
            current="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$current" --jq .object.sha)"
          fi

          if [ "$current" = "$sha" ]; then
            echo "$major already at $sha ($latest)"
            exit 0
          fi
          if ! git merge-base --is-ancestor "$current" "$sha" 2>/dev/null; then
            echo "$major is at $current, which is not an ancestor of $latest; not moving it backwards"
            exit 0
          fi
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$major" -f sha="$sha" -F force=true --silent
          echo "Moved $major to $sha ($latest)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
